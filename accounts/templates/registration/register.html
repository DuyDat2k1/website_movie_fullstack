{% extends 'movie_app/base.html' %}
{% block title %}Đăng kí - PhimMoi{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon"><i class="bi bi-person-plus"></i></div>
        <h2>Tạo tài khoản</h2>
        <p>Tham gia cộng đồng PhimMoi ngay</p>
      </div>
      <form id="registerForm">
        {% csrf_token %}
        <div class="input-group-custom">
          <div class="input-icon"><i class="bi bi-person"></i></div>
          <input type="text" name="username" placeholder="Tên đăng nhập" required>
        </div>
        <div class="input-group-custom">
          <div class="input-icon"><i class="bi bi-envelope"></i></div>
          <input type="email" name="email" placeholder="Email (không bắt buộc)">
        </div>
        <div class="input-group-custom">
          <div class="input-icon"><i class="bi bi-lock"></i></div>
          <input type="password" name="password" placeholder="Mật khẩu" required>
        </div>
        <div class="input-group-custom">
          <div class="input-icon"><i class="bi bi-lock-fill"></i></div>
          <input type="password" name="password2" placeholder="Nhập lại mật khẩu" required>
        </div>
        <div id="registerError" class="alert alert-danger d-none"></div>
        <button type="submit" class="auth-btn">
          <span>Đăng kí</span>
          <i class="bi bi-arrow-right"></i>
        </button>
      </form>
      <div class="auth-footer">
        Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập</a>
      </div>
    </div>
  </div>
</div>

<style>
.auth-wrapper {
  min-height: calc(100vh - 140px);
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f0f 70%);
  padding: 40px 20px;
}
.auth-container {
  width: 100%;
  max-width: 420px;
}
.auth-card {
  background: linear-gradient(145deg, #1a1a2e, #16213e);
  border: 1px solid #2a2a4a;
  border-radius: 16px;
  padding: 40px 36px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(229,9,20,0.05);
  position: relative;
  overflow: hidden;
}
.auth-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}
.auth-header {
  text-align: center;
  margin-bottom: 32px;
}
.auth-icon {
  width: 56px;
  height: 56px;
  margin: 0 auto 16px;
  background: linear-gradient(135deg, var(--accent), #ff4d4d);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  color: #fff;
  box-shadow: 0 8px 24px rgba(229,9,20,0.3);
}
.auth-header h2 {
  font-size: 1.5rem;
  font-weight: 700;
  margin: 0 0 6px;
}
.auth-header p {
  color: var(--text-secondary);
  font-size: 0.9rem;
  margin: 0;
}
.input-group-custom {
  position: relative;
  margin-bottom: 16px;
}
.input-group-custom .input-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-secondary);
  font-size: 1rem;
  z-index: 1;
  transition: color 0.3s;
}
.input-group-custom input {
  width: 100%;
  padding: 14px 16px 14px 44px;
  background: #0f0f0f;
  border: 1px solid #2a2a4a;
  border-radius: 10px;
  color: #fff;
  font-size: 0.9rem;
  transition: all 0.3s;
  outline: none;
}
.input-group-custom input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(229,9,20,0.1);
}
.input-group-custom input:focus ~ .input-icon {
  color: var(--accent);
}
.input-group-custom input::placeholder {
  color: #555;
}
.auth-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--accent), #dc0810);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 8px;
}
.auth-btn:hover {
  background: linear-gradient(135deg, #ff0f1f, var(--accent));
  box-shadow: 0 8px 24px rgba(229,9,20,0.3);
  transform: translateY(-1px);
}
.auth-btn:active {
  transform: scale(0.98);
}
.auth-btn i {
  font-size: 1.1rem;
  transition: transform 0.3s;
}
.auth-btn:hover i {
  transform: translateX(4px);
}
.auth-footer {
  text-align: center;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid #2a2a4a;
  color: var(--text-secondary);
  font-size: 0.9rem;
}
.auth-footer a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}
.auth-footer a:hover {
  text-decoration: underline;
}
</style>
<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const form = e.target;
  const data = {
    username: form.username.value,
    email: form.email.value,
    password: form.password.value,
    password2: form.password2.value,
  };
  const errorDiv = document.getElementById('registerError');
  errorDiv.classList.add('d-none');
  try {
    const res = await fetch('/api/auth/register/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': form.querySelector('[name=csrfmiddlewaretoken]').value },
      body: JSON.stringify(data),
    });
    const json = await res.json();
    if (res.ok) {
      window.location.href = '{% url "login" %}';
    } else {
      const msgs = json.username || json.email || json.password || json.password2 || json.non_field_errors || [];
      errorDiv.textContent = Array.isArray(msgs) ? msgs.join(', ') : (typeof msgs === 'string' ? msgs : 'Đăng kí thất bại');
      errorDiv.classList.remove('d-none');
    }
  } catch {
    errorDiv.textContent = 'Lỗi kết nối';
    errorDiv.classList.remove('d-none');
  }
});
</script>
{% endblock %}
