services:
  web:
    build: .
    env_file:
      - .env
    environment:
      DJANGO_DB_PATH: ${DJANGO_DB_PATH:-/app/data/main.sqlite3}
    volumes:
      - sqlite_data:/app/data
      - staticfiles:/app/staticfiles
    restart: unless-stopped

  nginx:
    build: ./deploy/nginx
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - staticfiles:/app/staticfiles
    depends_on:
      - web
    restart: unless-stopped

volumes:
  sqlite_data:
  staticfiles:
